<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>info-feed · 信息流</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280;
    --border: #e5e7eb; --accent: #7c3aed; --warn: #d97706; --warn-bg: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #181c22; --text: #e7eaee; --muted: #9aa3af;
      --border: #2a3038; --accent: #a78bfa; --warn: #fbbf24; --warn-bg: #2b2110;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  h1 img { width: 26px; height: 26px; border-radius: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chips button { border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 3px 13px; font-size: 13px; cursor: pointer; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .warn { color: var(--warn); background: var(--warn-bg); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; margin-bottom: 14px; }
  .day { margin: 22px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600;
    display: flex; align-items: center; gap: 10px; }
  .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .item { display: flex; gap: 12px; padding: 7px 0; align-items: baseline; }
  .item time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; width: 42px; }
  .item .src { flex: none; font-size: 12px; color: var(--accent); border: 1px solid var(--border);
    border-radius: 6px; padding: 0 7px; white-space: nowrap; }
  .item a { color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .item a:hover { color: var(--accent); }
  .empty { color: var(--muted); border: 1px dashed var(--border); border-radius: 12px;
    padding: 40px; text-align: center; margin-top: 20px; }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="/favicon.svg" alt="">信息流</h1>
  <div class="sub">按时间倒序聚合 config.env 里配置的 RSS/Atom 源 —— awesome-agent 样例项目。</div>
  <div class="chips" id="chips"></div>
  <div class="warn" id="warn" hidden></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>暂无条目 —— 检查 config.env 里的 FEEDS 配置。</div>
  <footer id="asof"></footer>
</div>
<script>
let cur = ''  // '' = 全部
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

function dayLabel(t) {
  const d = new Date(t), now = new Date()
  const day = x => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`
  if (day(d) === day(now)) return '今天'
  const y = new Date(now); y.setDate(now.getDate() - 1)
  if (day(d) === day(y)) return '昨天'
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`
}

async function load() {
  const q = cur ? `?source=${encodeURIComponent(cur)}` : ''
  const { items, sources, asOf } = await (await fetch('/api/timeline' + q)).json()

  // 源筛选 chips(含各源条数)
  document.getElementById('chips').innerHTML =
    [`<button class="${cur?'':'on'}" onclick="cur='';load()">全部</button>`,
     ...sources.map(s => `<button class="${cur===s.name?'on':''}"
        onclick="cur='${esc(s.name)}';load()">${esc(s.name)} ${s.count}</button>`)].join('')

  // 诚实: 拉取失败的源如实提示, 不隐藏不编造
  const bad = sources.filter(s => s.error)
  const warn = document.getElementById('warn')
  warn.hidden = !bad.length
  if (bad.length) warn.textContent = '⚠ 数据源暂不可用: ' + bad.map(s => `${s.name}(${s.error})`).join(' · ')

  // 按日分组渲染
  let html = '', lastDay = ''
  for (const it of items) {
    const label = it.time ? dayLabel(it.time) : '未知时间'
    if (label !== lastDay) { html += `<div class="day">${label}</div>`; lastDay = label }
    const hm = it.time ? new Date(it.time).toTimeString().slice(0, 5) : '--:--'
    html += `<div class="item"><time>${hm}</time><span class="src">${esc(it.source)}</span>
      <a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>`
  }
  document.getElementById('list').innerHTML = html
  document.getElementById('empty').hidden = items.length > 0
  document.getElementById('asof').textContent = `数据截至 ${new Date(asOf).toLocaleString()} · 条目时间与链接均来自源站,可溯源`
}
load()
</script>
</body>
</html>
